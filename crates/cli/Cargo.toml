[package]
name = "barrel-cli"
description = "Command-line tools for inspecting Atelier game data"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "barrel"
path = "src/main.rs"

[dependencies]
barrel-formats = { path = "../formats" }
barrel-engine = { path = "../engine" }
barrel-escha = { path = "../escha" }
barrel-ryza = { path = "../ryza" }
barrel-render = { path = "../render" }
encoding_rs = "0.8"
