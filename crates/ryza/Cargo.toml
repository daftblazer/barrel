[package]
name = "barrel-ryza"
description = "Atelier Ryza DX on Barrel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
barrel-files = { path = "../files" }
barrel-formats = { path = "../formats" }
barrel-engine = { path = "../engine" }
barrel-audio = { path = "../audio" }
barrel-render = { path = "../render" }
ash = "0.38"
libc = "0.2"
glam = "0.33"
winit = { version = "0.30", default-features = false, features = ["wayland", "x11", "rwh_06"] }
raw-window-handle = "0.6"
