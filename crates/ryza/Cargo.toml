[package]
name = "barrel-ryza"
description = "Atelier Ryza DX on Barrel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "barrel-ryza"
path = "src/play/main.rs"

[dependencies]
barrel-formats = { path = "../formats" }
barrel-engine = { path = "../engine" }
barrel-render = { path = "../render" }
ash = "0.38"
glam = "0.33"
winit = { version = "0.30", default-features = false, features = ["wayland", "x11", "rwh_06"] }
raw-window-handle = "0.6"
