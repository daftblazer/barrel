[package]
name = "barrel-render"
description = "Barrel's Vulkan renderer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
barrel-formats = { path = "../formats" }
sdl3-sys = { version = "=0.7.2", default-features = false, features = ["use-pkg-config"] }
ash = "0.38"
libc = "0.2"
glam = "0.33"
winit = { version = "0.30", default-features = false, features = ["wayland", "x11", "rwh_06"] }
raw-window-handle = "0.6"
